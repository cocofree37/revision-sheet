<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>修正依頼シート</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Antique&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: light dark;
    --paper: #eceef3; --surface: #f7f8fb; --surface-2: #ffffff;
    --ink: #18202e; --muted: #626b82; --rule: #d2d8e4;
    --accent: #27519b; --accent-soft: #dfe6f5; --on-accent: #ffffff;
    --signal: #b8472f;
    --s-todo: #b8472f; --s-doing: #27519b; --s-wait: #9a6a00; --s-done: #2f7a4f; --s-hold: #69728a;
    --s-todo-bg: #f6e2dc; --s-doing-bg: #dfe6f5; --s-wait-bg: #f5ead0; --s-done-bg: #dcefe3; --s-hold-bg: #e4e7ee;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #121722; --surface: #19202c; --surface-2: #1d2532;
      --ink: #e4e8f0; --muted: #8e98ac; --rule: #2a3342;
      --accent: #7ea6ea; --accent-soft: #1f2b40; --on-accent: #121722;
      --signal: #e2795c;
      --s-todo: #f0917a; --s-doing: #86aaea; --s-wait: #e0b552; --s-done: #6cc493; --s-hold: #9aa4b8;
      --s-todo-bg: #3a2320; --s-doing-bg: #1f2b40; --s-wait-bg: #382d14; --s-done-bg: #16301f; --s-hold-bg: #262d3b;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #121722; --surface: #19202c; --surface-2: #1d2532;
    --ink: #e4e8f0; --muted: #8e98ac; --rule: #2a3342;
    --accent: #7ea6ea; --accent-soft: #1f2b40; --on-accent: #121722;
    --signal: #e2795c;
    --s-todo: #f0917a; --s-doing: #86aaea; --s-wait: #e0b552; --s-done: #6cc493; --s-hold: #9aa4b8;
    --s-todo-bg: #3a2320; --s-doing-bg: #1f2b40; --s-wait-bg: #382d14; --s-done-bg: #16301f; --s-hold-bg: #262d3b;
  }

  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
    font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased;
  }
  .wrap { width: 100%; max-width: 980px; margin: 0 auto; padding-inline: 16px; }
  main.wrap { padding-block: 0 72px; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .label { font-size: 11px; letter-spacing: .16em; color: var(--muted); font-weight: 500; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
  [hidden] { display: none !important; }

  header.top { border-bottom: 1px solid var(--rule); background: var(--paper); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
  .top-in { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; padding-block: 12px; }
  .brand { font-family: "Zen Antique", "Hiragino Mincho ProN", serif; font-size: 21px; letter-spacing: .06em; margin: 0; font-weight: 400; }
  .top-in .sp { flex: 1; }
  .role { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
  .role select { background: var(--surface-2); border: 1px solid var(--rule); border-radius: 2px; padding: 3px 8px; font-size: 13px; }

  .notice { margin-block: 16px 0; padding: 10px 14px; border-left: 3px solid var(--signal); background: var(--surface); color: var(--muted); font-size: 13px; }

  .proj { display: flex; align-items: baseline; gap: 6px 16px; flex-wrap: wrap; margin-block: 22px 4px; }
  .proj h2 { font-family: "Zen Antique", "Hiragino Mincho ProN", serif; font-weight: 400; font-size: 22px; margin: 0; line-height: 1.4; overflow-wrap: anywhere; text-wrap: balance; }
  .proj a { color: var(--accent); font-size: 13px; overflow-wrap: anywhere; }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--muted); font-size: 12.5px; }
  .linkbtn:hover { color: var(--accent); text-decoration: underline; }
  .linkbtn.danger:hover, .linkbtn.confirm { color: var(--signal); }
  .ghost { background: none; border: 1px solid var(--rule); color: var(--accent); border-radius: 2px; padding: 6px 14px; font-size: 13px; }
  .ghost:hover { background: var(--accent-soft); }
  .primary { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 2px; padding: 8px 20px; font-weight: 500; font-size: 14px; letter-spacing: .04em; }
  .primary:hover { filter: brightness(1.08); }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-block: 14px 12px; }
  .chip { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 2px 12px; font-size: 13px; color: var(--ink); }
  .chip .n { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; margin-left: 5px; color: var(--muted); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .chip[aria-pressed="true"] .n { color: inherit; }

  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .toolbar input[type="search"] { flex: 1; min-width: 180px; }
  input[type="text"], input[type="search"], input[type="url"], select, textarea {
    background: var(--surface-2); border: 1px solid var(--rule); border-radius: 2px; padding: 8px 10px; font-size: 14.5px; width: 100%;
  }
  select { width: auto; }
  textarea { resize: vertical; min-height: 84px; line-height: 1.7; }
  .toolbar select { padding: 7px 10px; }

  form.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 3px; padding: 16px; margin-bottom: 18px; }
  form.panel h3 { margin: 0 0 12px; font-size: 15px; font-weight: 700; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .field > span, .field > label { font-size: 12px; color: var(--muted); }
  .req { color: var(--signal); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
  .hint { color: var(--muted); font-size: 12px; }
  .err { color: var(--signal); font-size: 13px; margin: 8px 0 0; }
  .attach { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .thumb { max-width: 160px; max-height: 100px; border: 1px solid var(--rule); border-radius: 2px; }

  /* 一覧 */
  .list-head, .row-i { display: grid; grid-template-columns: 3.4em minmax(0, 1fr) 4em 6.2em 9em; gap: 12px; align-items: center; }
  .list-head { padding: 6px 8px; border-bottom: 1px solid var(--rule); color: var(--muted); font-size: 11.5px; letter-spacing: .1em; }
  .rows { border-bottom: 1px solid var(--rule); }
  .row-i { width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--rule); padding: 11px 8px; }
  .row-i:first-child { border-top: 0; }
  .row-i:hover { background: var(--surface); }
  .c-no { color: var(--muted); font-size: 13px; }
  .ttl { display: block; font-weight: 500; line-height: 1.5; overflow-wrap: anywhere; }
  .sub { display: block; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .prio { font-size: 13px; }
  .prio[data-p="高"] { color: var(--signal); font-weight: 700; }
  .prio[data-p="低"] { color: var(--muted); }
  .c-when { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .pill { display: inline-block; font-size: 12px; font-weight: 500; padding: 1px 10px; border-radius: 10px; white-space: nowrap; }
  .pill[data-s="未対応"] { color: var(--s-todo); background: var(--s-todo-bg); }
  .pill[data-s="対応中"] { color: var(--s-doing); background: var(--s-doing-bg); }
  .pill[data-s="確認待ち"] { color: var(--s-wait); background: var(--s-wait-bg); }
  .pill[data-s="完了"] { color: var(--s-done); background: var(--s-done-bg); }
  .pill[data-s="保留"] { color: var(--s-hold); background: var(--s-hold-bg); }
  .empty { color: var(--muted); padding: 28px 8px; font-size: 14px; }

  /* 詳細 */
  .back { background: none; border: 0; padding: 2px 0; color: var(--accent); font-size: 13px; margin-block: 18px 6px; }
  .back:hover { text-decoration: underline; }
  h2.ititle { font-family: "Zen Antique", "Hiragino Mincho ProN", serif; font-weight: 400; font-size: 22px; margin: 4px 0 12px; line-height: 1.5; overflow-wrap: anywhere; text-wrap: balance; }
  .ihead { display: flex; gap: 10px; align-items: center; }
  dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0 0 14px; font-size: 13.5px; }
  dl.facts dt { color: var(--muted); }
  dl.facts dd { margin: 0; overflow-wrap: anywhere; }
  dl.facts a { color: var(--accent); }
  .detail { white-space: pre-wrap; overflow-wrap: anywhere; margin-bottom: 8px; }
  .pimg { display: block; max-width: 100%; max-height: 420px; border: 1px solid var(--rule); border-radius: 2px; margin-block: 8px 14px; }
  .ctrl { background: var(--surface); border: 1px solid var(--rule); border-radius: 3px; padding: 12px 14px; margin-block: 14px; display: flex; gap: 10px 14px; flex-wrap: wrap; align-items: end; }
  .ctrl .field { margin: 0; }
  .ctrl .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .comments { list-style: none; margin: 8px 0 16px; padding: 0; }
  .comments li { border-top: 1px solid var(--rule); padding-block: 12px; }
  .comments li:first-child { border-top: 0; }
  .chead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .cname { color: var(--ink); font-weight: 500; font-size: 13.5px; }
  .badge { font-size: 11px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--rule); }
  .badge[data-r="admin"] { color: var(--accent); border-color: var(--accent); }
  .cbody { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 2px; }

  .foot { margin-top: 36px; padding-top: 14px; border-top: 1px solid var(--rule); display: flex; gap: 10px 18px; flex-wrap: wrap; align-items: center; }

  @media (max-width: 680px) {
    .list-head { display: none; }
    .row-i { grid-template-columns: 3em minmax(0, 1fr) auto; grid-template-areas: "no main st" ". when when"; row-gap: 2px; }
    .row-i .c-no { grid-area: no; } .row-i .c-main { grid-area: main; } .row-i .pill { grid-area: st; }
    .row-i .prio { display: none; } .row-i .c-when { grid-area: when; }
    .grid2 { grid-template-columns: 1fr; }
    .brand { font-size: 19px; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap top-in">
    <h1 class="brand">修正依頼シート</h1>
    <span class="sp"></span>
    <label class="role">立場
      <select id="role" aria-label="立場">
        <option value="client">クライアント</option>
        <option value="admin">制作チーム</option>
      </select>
    </label>
  </div>
</header>

<main class="wrap">
  <div class="notice" id="notice">このページのデータは、いま使っているブラウザの中にだけ保存されます。他の人とは共有されません。共有するときは、下の「JSONで書き出す」「CSVで書き出す」を使ってください。</div>

  <!-- 一覧 -->
  <section id="listView">
    <div class="proj">
      <h2 id="pName"></h2>
      <a id="pSite" target="_blank" rel="noopener noreferrer" hidden></a>
      <button type="button" class="linkbtn" id="editProj">案件情報を編集</button>
    </div>

    <form class="panel" id="projForm" hidden>
      <h3>案件情報</h3>
      <div class="grid2">
        <div class="field"><label for="fpName">案件名（サイト名）</label><input type="text" id="fpName" maxlength="80"></div>
        <div class="field"><label for="fpUrl">サイトのURL</label><input type="url" id="fpUrl" placeholder="https://" maxlength="300"></div>
      </div>
      <div class="row"><span></span><span><button type="button" class="linkbtn" id="projCancel">キャンセル</button> <button type="submit" class="ghost">保存</button></span></div>
    </form>

    <div class="chips" id="chips" role="group" aria-label="ステータスで絞り込み"></div>

    <div class="toolbar">
      <input type="search" id="q" placeholder="内容・ページ・報告者で検索" maxlength="60" aria-label="検索">
      <select id="fCat" aria-label="分類で絞り込み"></select>
      <button type="button" class="primary" id="newBtn">＋ 修正を依頼する</button>
    </div>

    <form class="panel" id="newForm" hidden>
      <h3>修正を依頼する</h3>
      <div class="field"><label for="nTitle">修正してほしい内容 <span class="req">必須</span></label><input type="text" id="nTitle" maxlength="120" placeholder="例）トップページのキャッチコピーを差し替えたい" autocomplete="off"></div>
      <div class="field"><label for="nPage">対象のページ・場所</label><input type="text" id="nPage" maxlength="300" placeholder="ページのURL、または「トップ > ヘッダー」など" autocomplete="off"></div>
      <div class="field"><label for="nDetail">詳しい内容</label><textarea id="nDetail" maxlength="3000" placeholder="どこをどう直したいか、参考の文言や色などがあれば書いてください"></textarea></div>
      <div class="grid2">
        <div class="field"><label for="nCat">分類</label><select id="nCat" style="width:100%"></select></div>
        <div class="field"><label for="nPrio">優先度</label><select id="nPrio" style="width:100%"><option>高</option><option selected>中</option><option>低</option></select></div>
      </div>
      <div class="field">
        <span>スクリーンショット（任意）</span>
        <div class="attach">
          <button type="button" class="ghost" id="nPick">画像を選ぶ</button>
          <img class="thumb" id="nThumb" alt="添付画像のプレビュー" hidden>
          <button type="button" class="linkbtn" id="nUnpick" hidden>取り消す</button>
          <input type="file" id="nFile" accept="image/*" hidden>
        </div>
      </div>
      <div class="field"><label for="nName">お名前</label><input type="text" id="nName" maxlength="40" placeholder="例）田中" autocomplete="off"></div>
      <div class="row"><span class="hint">送信すると一覧に追加されます</span><span><button type="button" class="linkbtn" id="newCancel">キャンセル</button> <button type="submit" class="primary">依頼を追加</button></span></div>
      <p class="err" id="nErr" hidden></p>
    </form>

    <div class="list-head" aria-hidden="true"><span>No</span><span>内容</span><span>優先度</span><span>状態</span><span>報告者 / 更新</span></div>
    <div class="rows" id="rows"></div>

    <div class="foot">
      <button type="button" class="ghost" id="expJson">JSONで書き出す</button>
      <button type="button" class="ghost" id="expCsv">CSVで書き出す</button>
      <button type="button" class="ghost" id="impBtn">JSONを読み込む</button>
      <input type="file" id="impFile" accept="application/json,.json" hidden>
      <span class="sp" style="flex:1"></span>
      <button type="button" class="linkbtn danger" id="clearAll">すべて消去</button>
    </div>
    <p class="err" id="ioMsg" hidden></p>
  </section>

  <!-- 詳細 -->
  <section id="issueView" hidden>
    <button type="button" class="back" id="backBtn">← 一覧へ戻る</button>
    <div id="issueBox"></div>
    <form class="panel" id="cForm">
      <h3>コメントを書く</h3>
      <div class="field"><label for="cName">お名前</label><input type="text" id="cName" maxlength="40" autocomplete="off"></div>
      <div class="field"><label for="cBody">コメント</label><textarea id="cBody" maxlength="2000" placeholder="追記や質問、確認結果などを書いてください"></textarea></div>
      <div class="row"><span class="hint">Ctrl + Enter でも送信できます</span><button type="submit" class="primary">コメントする</button></div>
      <p class="err" id="cErr" hidden></p>
    </form>
  </section>
</main>

<script>
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  var STATUSES = ["未対応", "対応中", "確認待ち", "完了", "保留"];
  var CATEGORIES = ["デザイン", "文言・テキスト", "画像・写真", "機能・動作", "その他"];
  var ROLE_LABEL = { client: "クライアント", admin: "制作チーム" };
  var KEY = "shuusei-sheet-v1";

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function pad(n) { return String(n).padStart(2, "0"); }
  function fmt(iso) {
    var d = new Date(iso);
    return (d.getMonth() + 1) + "/" + d.getDate() + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  function fmtFull(iso) { var d = new Date(iso); return d.getFullYear() + "/" + fmt(iso); }
  function isHttp(u) { return /^https?:\/\/\S+$/i.test(u || ""); }
  function safeImg(s) { return typeof s === "string" && /^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(s) ? s : ""; }

  /* ================= データ層（あとでDBに差し替える場所） ================= */
  var store = (function () {
    var data = null;
    function iso(minAgo) { return new Date(Date.now() - minAgo * 60000).toISOString(); }
    function seed() {
      return {
        sample: true, nextNo: 5, nextCid: 4,
        project: { name: "サンプル株式会社 コーポレートサイト", siteUrl: "https://example.com" },
        issues: [
          { no: 1, title: "トップページのキャッチコピーを差し替えたい", pageUrl: "https://example.com/", detail: "現在のコピーを「暮らしに、もう少しの余白を。」に変更してください。フォントサイズは今のままで大丈夫です。", category: "文言・テキスト", priority: "高", status: "対応中", reporter: "田中", assignee: "佐藤", image: "", createdAt: iso(3000), updatedAt: iso(200),
            comments: [{ id: 1, author: "佐藤", role: "admin", body: "承知しました。本日中に反映してテスト環境で確認できるようにします。", at: iso(200) }] },
          { no: 2, title: "スマホでメニューボタンが押しにくい", pageUrl: "トップ > ヘッダー", detail: "iPhoneで見るとメニューのボタンが小さく、何度か押し直しました。もう少し大きくできますか？", category: "デザイン", priority: "中", status: "確認待ち", reporter: "田中", assignee: "佐藤", image: "", createdAt: iso(2600), updatedAt: iso(90),
            comments: [{ id: 2, author: "佐藤", role: "admin", body: "ボタンを44px四方に拡大しました。ご確認をお願いします。", at: iso(90) }] },
          { no: 3, title: "会社概要の代表者写真を新しいものに", pageUrl: "https://example.com/about", detail: "新しい写真を別途メールでお送りします。", category: "画像・写真", priority: "低", status: "未対応", reporter: "鈴木", assignee: "", image: "", createdAt: iso(1500), updatedAt: iso(1500), comments: [] },
          { no: 4, title: "お問い合わせフォームの送信後にメールが届かない", pageUrl: "https://example.com/contact", detail: "テスト送信をしましたが、自動返信メールが届きませんでした。迷惑メールにも入っていません。", category: "機能・動作", priority: "高", status: "完了", reporter: "田中", assignee: "佐藤", image: "", createdAt: iso(5000), updatedAt: iso(4000),
            comments: [{ id: 3, author: "田中", role: "client", body: "届くようになりました。ありがとうございます。", at: iso(4000) }] }
        ]
      };
    }
    function load() {
      if (data) return data;
      try { var s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.issues)) { data = s; return data; } } catch (e) {}
      data = seed();
      return data;
    }
    function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }
    function find(no) { return load().issues.find(function (i) { return i.no === no; }); }
    return {
      all: function () { return load(); },
      project: function () { return load().project; },
      setProject: function (p) { load().project = p; save(); },
      issues: function () { return load().issues; },
      get: find,
      add: function (v) {
        var d = load(), now = new Date().toISOString();
        var i = { no: d.nextNo++, title: v.title, pageUrl: v.pageUrl, detail: v.detail, category: v.category, priority: v.priority,
          status: "未対応", reporter: v.reporter, assignee: "", image: v.image || "", createdAt: now, updatedAt: now, comments: [] };
        d.issues.push(i); save(); return i.no;
      },
      update: function (no, patch) {
        var i = find(no); if (!i) return;
        Object.keys(patch).forEach(function (k) { i[k] = patch[k]; });
        i.updatedAt = new Date().toISOString(); save();
      },
      remove: function (no) { var d = load(); d.issues = d.issues.filter(function (i) { return i.no !== no; }); save(); },
      comment: function (no, c) {
        var d = load(), i = find(no); if (!i) return;
        i.comments.push({ id: d.nextCid++, author: c.author, role: c.role, body: c.body, at: new Date().toISOString() });
        i.updatedAt = new Date().toISOString(); save();
      },
      clearSample: function () { var d = load(); d.sample = false; save(); },
      replace: function (nd) { data = nd; save(); },
      reset: function () { data = { sample: false, nextNo: 1, nextCid: 1, project: { name: "新しい案件", siteUrl: "" }, issues: [] }; save(); }
    };
  })();

  /* ================= 端末内の覚え書き ================= */
  function lsGet(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  var role = lsGet("shuusei-role") === "admin" ? "admin" : "client";
  var view = { status: "all", cat: "all", q: "" };
  var pendingImg = "";
  var confirmDel = false, delTimer = null;

  /* ================= 一覧 ================= */
  function renderProject() {
    var p = store.project();
    $("#pName").textContent = p.name || "（案件名なし）";
    document.title = (p.name ? p.name + " | " : "") + "修正依頼シート";
    var a = $("#pSite");
    if (isHttp(p.siteUrl)) { a.href = p.siteUrl; a.textContent = "サイトを開く ↗"; a.hidden = false; } else { a.hidden = true; }
  }

  function renderList() {
    var all = store.issues();
    var counts = { all: all.length };
    STATUSES.forEach(function (s) { counts[s] = all.filter(function (i) { return i.status === s; }).length; });
    var h = "";
    ["all"].concat(STATUSES).forEach(function (s) {
      h += '<button type="button" class="chip" data-status="' + s + '" aria-pressed="' + (view.status === s) + '">' +
        (s === "all" ? "すべて" : s) + '<span class="n">' + counts[s] + "</span></button>";
    });
    $("#chips").innerHTML = h;

    var q = view.q.toLowerCase();
    var list = all.filter(function (i) {
      if (view.status !== "all" && i.status !== view.status) return false;
      if (view.cat !== "all" && i.category !== view.cat) return false;
      if (q && (i.title + " " + i.pageUrl + " " + i.reporter + " " + i.detail).toLowerCase().indexOf(q) < 0) return false;
      return true;
    }).sort(function (a, b) { return b.no - a.no; });

    if (!all.length) { $("#rows").innerHTML = '<p class="empty">まだ修正依頼はありません。「＋ 修正を依頼する」から追加してください。</p>'; return; }
    if (!list.length) { $("#rows").innerHTML = '<p class="empty">条件に合う依頼はありません。</p>'; return; }
    $("#rows").innerHTML = list.map(function (i) {
      var sub = [i.category];
      if (i.pageUrl) sub.push(i.pageUrl);
      if (i.image) sub.push("画像あり");
      if (i.comments.length) sub.push("コメント " + i.comments.length);
      return '<button type="button" class="row-i" data-no="' + i.no + '">' +
        '<span class="c-no mono">#' + i.no + "</span>" +
        '<span class="c-main"><span class="ttl">' + esc(i.title) + '</span><span class="sub">' + esc(sub.join(" ・ ")) + "</span></span>" +
        '<span class="prio" data-p="' + esc(i.priority) + '">' + esc(i.priority) + "</span>" +
        '<span class="pill" data-s="' + esc(i.status) + '">' + esc(i.status) + "</span>" +
        '<span class="c-when mono">' + esc(i.reporter || "―") + "<br>" + fmt(i.updatedAt) + "</span></button>";
    }).join("");
  }

  /* ================= 詳細 ================= */
  function opts(list, cur) {
    return list.map(function (v) { return "<option" + (v === cur ? " selected" : "") + ">" + esc(v) + "</option>"; }).join("");
  }
  function renderIssue(no) {
    var i = store.get(no);
    if (!i) { location.hash = "#/"; return; }
    var img = safeImg(i.image);
    var h = '<div class="ihead"><span class="mono c-no">#' + i.no + '</span><span class="pill" data-s="' + esc(i.status) + '">' + esc(i.status) + "</span></div>" +
      '<h2 class="ititle">' + esc(i.title) + "</h2>" +
      '<dl class="facts"><dt>分類</dt><dd>' + esc(i.category) + "</dd><dt>優先度</dt><dd>" + esc(i.priority) + "</dd>" +
      "<dt>対象</dt><dd>" + (isHttp(i.pageUrl) ? '<a href="' + esc(i.pageUrl) + '" target="_blank" rel="noopener noreferrer">' + esc(i.pageUrl) + " ↗</a>" : esc(i.pageUrl || "―")) + "</dd>" +
      "<dt>報告者</dt><dd>" + esc(i.reporter || "―") + "</dd><dt>依頼日</dt><dd class='mono'>" + fmtFull(i.createdAt) + "</dd>" +
      "<dt>担当</dt><dd>" + esc(i.assignee || "未定") + "</dd></dl>" +
      (i.detail ? '<div class="detail">' + esc(i.detail) + "</div>" : "") +
      (img ? '<img class="pimg" alt="添付画像" src="' + img + '">' : "");

    if (role === "admin") {
      h += '<div class="ctrl">' +
        '<div class="field"><label for="sStatus">状態</label><select id="sStatus" data-field="status">' + opts(STATUSES, i.status) + "</select></div>" +
        '<div class="field"><label for="sPrio">優先度</label><select id="sPrio" data-field="priority">' + opts(["高", "中", "低"], i.priority) + "</select></div>" +
        '<div class="field"><label for="sCat">分類</label><select id="sCat" data-field="category">' + opts(CATEGORIES, i.category) + "</select></div>" +
        '<div class="field"><label for="sAssign">担当</label><input type="text" id="sAssign" data-field="assignee" value="' + esc(i.assignee) + '" maxlength="40" style="width:9em"></div>' +
        '<div class="acts"><button type="button" class="linkbtn danger' + (confirmDel ? " confirm" : "") + '" data-act="del">' + (confirmDel ? "本当に削除" : "この依頼を削除") + "</button></div></div>";
    } else if (i.status === "確認待ち") {
      h += '<div class="ctrl"><span>制作チームから修正の確認依頼が来ています。</span><div class="acts">' +
        '<button type="button" class="primary" data-act="ok">修正を確認しました（完了）</button>' +
        '<button type="button" class="ghost" data-act="ng">まだ直っていません（差し戻し）</button></div></div>';
    }

    h += '<span class="label">やりとり</span><ol class="comments">' +
      (i.comments.length ? i.comments.map(function (c) {
        return '<li><div class="chead"><span class="cname">' + esc(c.author || "名無しさん") + '</span><span class="badge" data-r="' + esc(c.role) + '">' +
          esc(ROLE_LABEL[c.role] || "") + '</span><span class="mono">' + fmt(c.at) + '</span></div><div class="cbody">' + esc(c.body) + "</div></li>";
      }).join("") : '<li class="hint">まだコメントはありません。</li>') + "</ol>";
    $("#issueBox").innerHTML = h;
  }

  /* ================= 画面切り替え ================= */
  function route() {
    var m = location.hash.match(/^#\/i\/(\d+)$/);
    if (m) {
      confirmDel = false;
      $("#listView").hidden = true; $("#issueView").hidden = false;
      renderIssue(parseInt(m[1], 10));
      window.scrollTo(0, 0);
    } else {
      $("#issueView").hidden = true; $("#listView").hidden = false;
      renderProject(); renderList();
    }
  }
  function refresh() { route(); }

  /* ================= 操作 ================= */
  $("#role").value = role;
  $("#role").addEventListener("change", function () { role = $("#role").value; lsSet("shuusei-role", role); confirmDel = false; refresh(); });

  $("#chips").addEventListener("click", function (e) {
    var b = e.target.closest(".chip"); if (!b) return;
    view.status = b.dataset.status; renderList();
  });
  $("#q").addEventListener("input", function () { view.q = $("#q").value.trim(); renderList(); });
  $("#fCat").addEventListener("change", function () { view.cat = $("#fCat").value; renderList(); });
  $("#rows").addEventListener("click", function (e) {
    var r = e.target.closest(".row-i"); if (r) location.hash = "#/i/" + r.dataset.no;
  });
  $("#backBtn").addEventListener("click", function () { location.hash = "#/"; });
  window.addEventListener("hashchange", route);

  $("#fCat").innerHTML = '<option value="all">すべての分類</option>' + CATEGORIES.map(function (c) { return "<option>" + c + "</option>"; }).join("");
  $("#nCat").innerHTML = opts(CATEGORIES, "デザイン");

  /* 案件情報 */
  $("#editProj").addEventListener("click", function () {
    var p = store.project(); $("#fpName").value = p.name || ""; $("#fpUrl").value = p.siteUrl || "";
    $("#projForm").hidden = false; $("#fpName").focus();
  });
  $("#projCancel").addEventListener("click", function () { $("#projForm").hidden = true; });
  $("#projForm").addEventListener("submit", function (e) {
    e.preventDefault();
    store.setProject({ name: $("#fpName").value.trim(), siteUrl: $("#fpUrl").value.trim() });
    $("#projForm").hidden = true; renderProject();
  });

  /* 新規依頼 */
  function setImg(dataUrl) {
    pendingImg = dataUrl || "";
    $("#nThumb").hidden = !pendingImg; $("#nUnpick").hidden = !pendingImg;
    if (pendingImg) $("#nThumb").src = pendingImg;
    if (!pendingImg) $("#nFile").value = "";
  }
  async function toDataUrl(file) {
    var bmp = await createImageBitmap(file);
    var max = 1400, q = 0.75, out = "";
    var sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
    for (var t = 0; t < 4; t++) {
      var c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(bmp.width * sc)); c.height = Math.max(1, Math.round(bmp.height * sc));
      c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
      out = c.toDataURL("image/jpeg", q);
      if (out.length < 500000) return out;
      sc *= 0.8; q -= 0.08;
    }
    return out;
  }
  $("#newBtn").addEventListener("click", function () {
    var f = $("#newForm"); f.hidden = !f.hidden;
    if (!f.hidden) { $("#nName").value = lsGet("shuusei-name"); $("#nTitle").focus(); }
  });
  $("#newCancel").addEventListener("click", function () { $("#newForm").hidden = true; });
  $("#nPick").addEventListener("click", function () { $("#nFile").click(); });
  $("#nUnpick").addEventListener("click", function () { setImg(""); });
  $("#nFile").addEventListener("change", async function (e) {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    $("#nErr").hidden = true;
    try { setImg(await toDataUrl(f)); }
    catch (err) { setImg(""); $("#nErr").textContent = "この画像は読み込めませんでした。別の画像を選んでください。"; $("#nErr").hidden = false; }
  });
  $("#newForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var title = $("#nTitle").value.trim();
    if (!title) { $("#nErr").textContent = "修正してほしい内容を入力してください。"; $("#nErr").hidden = false; return; }
    $("#nErr").hidden = true;
    var name = $("#nName").value.trim();
    lsSet("shuusei-name", name);
    var no = store.add({ title: title, pageUrl: $("#nPage").value.trim(), detail: $("#nDetail").value.trim(),
      category: $("#nCat").value, priority: $("#nPrio").value, reporter: name, image: pendingImg });
    $("#nTitle").value = ""; $("#nPage").value = ""; $("#nDetail").value = ""; setImg("");
    $("#newForm").hidden = true;
    location.hash = "#/i/" + no;
  });

  /* 詳細内の操作 */
  $("#issueBox").addEventListener("change", function (e) {
    var f = e.target.dataset.field; if (!f) return;
    var no = parseInt(location.hash.split("/")[2], 10), patch = {};
    patch[f] = e.target.value.trim();
    store.update(no, patch); renderIssue(no);
  });
  $("#issueBox").addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b) return;
    var no = parseInt(location.hash.split("/")[2], 10);
    var name = lsGet("shuusei-name") || (role === "admin" ? "制作チーム" : "クライアント");
    if (b.dataset.act === "ok") {
      store.update(no, { status: "完了" }); store.comment(no, { author: name, role: role, body: "修正を確認しました。完了とします。" }); renderIssue(no);
    } else if (b.dataset.act === "ng") {
      store.update(no, { status: "未対応" }); store.comment(no, { author: name, role: role, body: "まだ直っていないため、差し戻します。" }); renderIssue(no);
    } else if (b.dataset.act === "del") {
      if (!confirmDel) { confirmDel = true; clearTimeout(delTimer); delTimer = setTimeout(function () { confirmDel = false; if (location.hash.indexOf("#/i/") === 0) renderIssue(no); }, 4000); renderIssue(no); return; }
      clearTimeout(delTimer); confirmDel = false; store.remove(no); location.hash = "#/";
    }
  });

  /* コメント */
  $("#cForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var body = $("#cBody").value.trim();
    if (!body) { $("#cErr").textContent = "コメントを入力してください。"; $("#cErr").hidden = false; return; }
    $("#cErr").hidden = true;
    var name = $("#cName").value.trim(); lsSet("shuusei-name", name);
    var no = parseInt(location.hash.split("/")[2], 10);
    store.comment(no, { author: name, role: role, body: body });
    $("#cBody").value = ""; renderIssue(no);
  });
  $("#cBody").addEventListener("keydown", function (ev) { if ((ev.ctrlKey || ev.metaKey) && ev.key === "Enter") $("#cForm").requestSubmit(); });
  window.addEventListener("hashchange", function () { $("#cName").value = lsGet("shuusei-name"); });
  $("#cName").value = lsGet("shuusei-name");

  /* 書き出し・読み込み */
  function download(name, text, type) {
    var blob = new Blob([text], { type: type });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }
  function stamp() { var d = new Date(); return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()); }
  function ioMsg(t, bad) { var el = $("#ioMsg"); el.textContent = t; el.hidden = !t; el.style.color = bad ? "" : "var(--muted)"; }
  $("#expJson").addEventListener("click", function () {
    var d = store.all();
    download("shuusei-sheet-" + stamp() + ".json", JSON.stringify(d, null, 2), "application/json");
    ioMsg("JSONを書き出しました。読み込みは、同じ形式のファイルを「JSONを読み込む」から選びます。");
  });
  $("#expCsv").addEventListener("click", function () {
    var rows = [["No", "内容", "対象", "分類", "優先度", "状態", "報告者", "担当", "詳細", "コメント数", "依頼日", "更新日"]];
    store.issues().slice().sort(function (a, b) { return a.no - b.no; }).forEach(function (i) {
      rows.push([i.no, i.title, i.pageUrl, i.category, i.priority, i.status, i.reporter, i.assignee, i.detail, i.comments.length, fmtFull(i.createdAt), fmtFull(i.updatedAt)]);
    });
    var csv = rows.map(function (r) { return r.map(function (v) { return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"'; }).join(","); }).join("\r\n");
    download("shuusei-sheet-" + stamp() + ".csv", "﻿" + csv, "text/csv");
    ioMsg("CSVを書き出しました（Excelでそのまま開けます）。");
  });
  $("#impBtn").addEventListener("click", function () { $("#impFile").click(); });
  $("#impFile").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(r.result);
        if (!d || !Array.isArray(d.issues) || !d.project) throw new Error("bad");
        d.issues.forEach(function (i) { i.comments = Array.isArray(i.comments) ? i.comments : []; });
        d.nextNo = Math.max.apply(null, [0].concat(d.issues.map(function (i) { return i.no || 0; }))) + 1;
        d.nextCid = Math.max.apply(null, [0].concat(d.issues.reduce(function (a, i) { return a.concat(i.comments.map(function (c) { return c.id || 0; })); }, []))) + 1;
        if (!confirm("いまの内容を、読み込むファイルの内容で置き換えます。よろしいですか？")) return;
        store.replace(d); ioMsg("読み込みました（" + d.issues.length + " 件）。"); refresh();
      } catch (err) { ioMsg("このファイルは読み込めません。このページで書き出したJSONを選んでください。", true); }
      $("#impFile").value = "";
    };
    r.readAsText(f);
  });
  var clearArmed = false, clearTimer = null;
  $("#clearAll").addEventListener("click", function () {
    var b = $("#clearAll");
    if (!clearArmed) { clearArmed = true; b.textContent = "本当に全部消す"; b.classList.add("confirm"); clearTimer = setTimeout(function () { clearArmed = false; b.textContent = "すべて消去"; b.classList.remove("confirm"); }, 4000); return; }
    clearTimeout(clearTimer); clearArmed = false; b.textContent = "すべて消去"; b.classList.remove("confirm");
    store.reset(); $("#notice").textContent = baseNotice; refresh();
  });

  /* サンプル表示中の案内 */
  var baseNotice = $("#notice").textContent;
  if (store.all().sample) {
    $("#notice").innerHTML = "いまはサンプルの依頼が入っています。画面の確認が済んだら、一番下の「すべて消去」で空にして使い始めてください。<br>" + esc(baseNotice);
  }
  route();
})();
</script>
</body>
</html>
