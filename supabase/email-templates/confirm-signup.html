<!--
  Supabase → Authentication → Emails → Templates →「Confirm sign up」に貼り付けます。
  （初めてログインするメールアドレスには、こちらの文面が使われます）
  件名（Subject）: 【修正依頼シート】メールアドレスの確認とログイン
  ※ 独自の SMTP を設定しないと、Supabase の標準メールでは文面を編集できません。
-->
<div style="font-family:'Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP',sans-serif;color:#333333;line-height:1.9;max-width:520px;margin:0 auto;padding:32px 24px;">
  <p style="letter-spacing:0.3em;font-size:12px;color:#777777;margin:0 0 28px;">修正依頼シート</p>
  <h2 style="font-weight:400;font-size:20px;letter-spacing:0.06em;margin:0 0 18px;">メールアドレスの確認とログイン</h2>
  <p style="margin:0 0 8px;">はじめてのご利用ありがとうございます。下のボタンを押すと、メールアドレスの確認が完了し、そのままログインできます。</p>
  <p style="margin:0;font-size:13px;color:#777777;">このリンクは、一度だけ使えます。有効期限が切れたときは、ログイン画面からもう一度、リンクを送ってください。</p>
  <p style="margin:32px 0;">
    <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#333333;color:#ffffff;text-decoration:none;padding:13px 36px;border-radius:999px;font-size:14px;letter-spacing:0.12em;">確認してログインする</a>
  </p>
  <p style="font-size:12px;color:#777777;margin:0 0 6px;">ボタンを押せないときは、次のURLをブラウザに貼り付けてください。</p>
  <p style="font-size:12px;color:#777777;word-break:break-all;margin:0 0 28px;">{{ .ConfirmationURL }}</p>
  <hr style="border:0;border-top:1px solid #e4e4e1;margin:0 0 16px;">
  <p style="font-size:12px;color:#777777;margin:0;">このメールに心当たりがないときは、そのまま破棄してください。</p>
</div>
